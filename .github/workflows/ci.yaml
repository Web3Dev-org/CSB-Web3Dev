name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build-backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - working-directory: ./backend
        run: mvn clean package -B

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - working-directory: ./frontend
        run: npm ci
      - working-directory: ./frontend
        run: npm run build

  docker-integration:
    name: Docker Compose Dry Run
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - uses: actions/checkout@v4
    
      - name: Create .env for CI
        run: |
          echo "DB_ROOT_PASSWORD=ci_root_pass" >> .env
          echo "DB_NAME=appdb" >> .env
          echo "DB_USER=ci_user" >> .env
          echo "DB_PASSWORD=ci_pass" >> .env

      - name: Start containers
        run: docker compose up -d --build
        
      - name: Wait for containers to be healthy
        run: |
          sleep 15
          docker compose ps
          if [ $(docker ps -a | grep -i exited | wc -l) -gt 0 ]; then
            echo "One or more containers crashed!"
            docker compose logs
            exit 1
          fi

      - name: Stop and cleanup
        run: docker compose down