server:
  servlet:
    context-path: /api
app:
  jwt:
    secret: ${JWT_SECRET:cheie-secreta-dev-rezervari-sport-usv-minim-32-caractere-2026}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  payments:
    # Baza URL-ului pentru plata prin link (procesator simulat; nu există încă un gateway real)
    link-base-url: ${PAYMENT_LINK_BASE_URL:http://localhost:5173/plata}
  notifications:
    reminders:
      # Memento-uri in-app trimise cu users.reminder_minutes înainte de începerea rezervării
      enabled: ${REMINDERS_ENABLED:true}
      interval-ms: ${REMINDERS_INTERVAL_MS:60000}

spring:
  application:
    name: app
  datasource:
    url: jdbc:mysql://${DB_URL:localhost}:${DB_PORT:3306}/${DB_NAME:rezervari_sport_usv}?useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=Europe/Bucharest
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:12345678!}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: Europe/Bucharest
  mvc:
    problemdetails:
      enabled: true
