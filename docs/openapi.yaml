openapi: 3.0.3

info:
  title: Rezervări Sport USV API
  version: 1.1.0
  description: |
    Contractul RESTful (Design-First) pentru platforma de rezervări baze sportive USV.
    Acest document definește interfața dintre client (ex. aplicație web/mobilă) și backend.

    Convenții:
    - Autentificare: JWT Bearer, header `Authorization: Bearer <token>`.
    - Erori: RFC 7807, `application/problem+json`.
    - Sumele de bani sunt exprimate în RON, cu pas de 0.01.
    - Orele sloturilor sunt în ora locală (Europe/Bucharest).

servers:
  - url: http://localhost:8080/api
    description: Server de dezvoltare local
  - url: https://api.sport.usv.ro/api
    description: Server de producție (URL provizoriu, de actualizat după alegerea platformei de deploy)

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Autentificare și gestionare sesiuni
  - name: Users
    description: Operațiuni utilizatori și profil
  - name: Facilities
    description: Baze sportive și disponibilitate
  - name: Bookings
    description: Gestionarea rezervărilor
  - name: Payments
    description: Procesarea plăților
  - name: App
    description: Date globale (Echipamente, Setări, Termeni)

paths:

  /auth/login:
    post:
      tags:
        - Auth
      operationId: login
      summary: Autentificare utilizator
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autentificare reușită
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ServerError'

  /auth/register:
    post:
      tags:
        - Auth
      operationId: register
      summary: Înregistrare utilizator nou
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Utilizator creat cu succes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/ServerError'

  /users/me:
    get:
      tags:
        - Users
      operationId: getCurrentUser
      summary: Datele profilului curent
      responses:
        '200':
          description: Profil returnat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ServerError'

  /facilities:
    get:
      tags:
        - Facilities
      operationId: listFacilities
      summary: Lista facilităților sportive active
      security: []
      responses:
        '200':
          description: O listă de facilități
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Facility'
        default:
          $ref: '#/components/responses/ServerError'

  /facilities/{id}/availability:
    get:
      tags:
        - Facilities
      operationId: getFacilityAvailability
      summary: Obține sloturile disponibile/ocupate pentru o zi
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: date
          in: query
          required: true
          description: Data în format YYYY-MM-DD
          schema:
            type: string
            format: date
      responses:
        '200':
          description: O listă de sloturi orare
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SlotAvailability'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/ServerError'

  /app/equipment:
    get:
      tags:
        - App
      operationId: listEquipment
      summary: Lista echipamentelor extra active
      security: []
      responses:
        '200':
          description: O listă de echipamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Equipment'
        default:
          $ref: '#/components/responses/ServerError'

  /app/terms/current:
    get:
      tags:
        - App
      operationId: getCurrentTerms
      summary: Obține termenii și condițiile curente
      security: []
      responses:
        '200':
          description: Termenii curenți (necesari la rezervare)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Terms'
        default:
          $ref: '#/components/responses/ServerError'

  /bookings:
    get:
      tags:
        - Bookings
      operationId: listMyBookings
      summary: Istoricul rezervărilor utilizatorului curent
      parameters:
        - name: page
          in: query
          required: false
          description: Numărul paginii (începe de la 0)
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Numărul de elemente per pagină
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: O pagină cu rezervările utilizatorului
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ServerError'

    post:
      tags:
        - Bookings
      operationId: createBooking
      summary: Creează o nouă rezervare
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
      responses:
        '201':
          description: Rezervare creată cu succes (status 'in_asteptare')
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/ServerError'

  /bookings/{id}:
    get:
      tags:
        - Bookings
      operationId: getBookingById
      summary: Detaliile unei rezervări a utilizatorului curent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Detaliile rezervării
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/ServerError'

  /bookings/{id}/cancel:
    post:
      tags:
        - Bookings
      operationId: cancelBooking
      summary: Anulează o rezervare existentă
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 255
                  description: Motivul anulării (opțional)
      responses:
        '200':
          description: Rezervare anulată cu succes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/ServerError'

  /payments/initiate:
    post:
      tags:
        - Payments
      operationId: initiatePayment
      summary: Inițiază procesul de plată pentru o rezervare
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentInitiateRequest'
      responses:
        '200':
          description: Plată inițiată, returnează link-ul sau confirmarea
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentInitiateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/ServerError'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Date de intrare invalide
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'

    Unauthorized:
      description: Token JWT lipsă sau invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'

    NotFound:
      description: Resursa solicitată nu a fost găsită
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'

    Conflict:
      description: Conflict de stare (ex. slot orar deja ocupat)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'

    ServerError:
      description: Eroare internă neașteptată
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'

  schemas:

    # --- ENUMURI comune ---

    BookingType:
      type: string
      enum:
        - ora
        - joc

    BookingStatus:
      type: string
      enum:
        - in_asteptare
        - aprobata
        - respinsa
        - anulata
        - finalizata

    # --- AUTH & USERS ---

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - full_name
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          description: Minim 8 caractere
        full_name:
          type: string
        phone:
          type: string

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT Bearer Token
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        full_name:
          type: string
        phone:
          type: string
        role:
          type: string
          enum:
            - user
            - admin
        status_code:
          type: string
          description: Codul din tabelul user_statuses (momentan 'student', 'cadru', 'extern'); tabelul permite extensii viitoare
        status_verified:
          type: boolean
        notify_in_app:
          type: boolean
        notify_email:
          type: boolean
        reminder_minutes:
          type: integer
          enum:
            - 30
            - 60
            - 120
            - 1440
        created_at:
          type: string
          format: date-time

    # --- FACILITIES & EQUIPMENT ---

    Facility:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        price_per_hour:
          type: number
          format: double
          multipleOf: 0.01
          description: Prețul pe oră, în RON
        game_multiplier:
          type: number
          format: double
          description: Multiplicatorul aplicat pentru rezervări de tip 'joc'

    SlotAvailability:
      type: object
      properties:
        start_time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Ora locală de început a slotului, format HH:mm (Europe/Bucharest). Data rezultă din parametrul `date` din query.
        status:
          type: string
          enum:
            - disponibil
            - rezervare
            - blocat
            - inchis
          description: Statusul conform view-ului v_occupied_slots

    Equipment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        price:
          type: number
          format: double
          multipleOf: 0.01
          description: Prețul unitar, în RON
        stock:
          type: integer
          nullable: true
          description: Null pentru stoc nelimitat

    Terms:
      type: object
      properties:
        id:
          type: integer
          format: int64
        body:
          type: string
        published_at:
          type: string
          format: date-time

    # --- BOOKINGS ---

    BookingRequest:
      type: object
      required:
        - facility_id
        - type
        - start_at
        - hours_count
        - terms_version_id
      properties:
        facility_id:
          type: integer
          format: int64
        type:
          $ref: '#/components/schemas/BookingType'
        start_at:
          type: string
          format: date-time
        hours_count:
          type: integer
          minimum: 1
          description: Durata în ore (numărul de sloturi ocupate). Obligatoriu pentru ambele tipuri; la 'joc' prețul se calculează cu game_multiplier, dar durata rămâne necesară pentru sloturi.
        terms_version_id:
          type: integer
          format: int64
          description: ID-ul termenilor acceptați (din /app/terms/current)
        equipment:
          type: array
          items:
            $ref: '#/components/schemas/BookingEquipmentRequest'

    BookingEquipmentRequest:
      type: object
      required:
        - equipment_id
        - quantity
      properties:
        equipment_id:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1

    BookingPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/BookingSummary'
        page:
          type: integer
          description: Pagina curentă (începe de la 0)
        size:
          type: integer
          description: Dimensiunea paginii
        total_elements:
          type: integer
          format: int64
        total_pages:
          type: integer

    BookingSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        facility_name:
          type: string
        type:
          $ref: '#/components/schemas/BookingType'
        status:
          $ref: '#/components/schemas/BookingStatus'
        start_at:
          type: string
          format: date-time
        total_amount:
          type: number
          format: double
          multipleOf: 0.01
          description: Suma totală, în RON
        can_cancel:
          type: boolean
          description: Calculat din v_my_bookings

    BookingDetail:
      allOf:
        - $ref: '#/components/schemas/BookingSummary'
        - type: object
          properties:
            hours_count:
              type: integer
            base_amount:
              type: number
              format: double
              multipleOf: 0.01
              description: Suma de bază, în RON
            equipment_amount:
              type: number
              format: double
              multipleOf: 0.01
              description: Suma echipamentelor, în RON
            discount_percent:
              type: number
              format: double
            discount_amount:
              type: number
              format: double
              multipleOf: 0.01
              description: Reducerea aplicată, în RON
            created_at:
              type: string
              format: date-time
            equipment_list:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  quantity:
                    type: integer
                  unit_price:
                    type: number
                    format: double
                    multipleOf: 0.01
                    description: Prețul unitar, în RON

    # --- PAYMENTS ---

    PaymentInitiateRequest:
      type: object
      required:
        - booking_id
        - method
      properties:
        booking_id:
          type: integer
          format: int64
        method:
          type: string
          enum:
            - card_online
            - link_plata
            - numerar

    PaymentInitiateResponse:
      type: object
      properties:
        payment_id:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - initiata
            - reusita
            - esuata
          description: Submulțime din payments.status; 'rambursata' nu apare la inițiere
        payment_link:
          type: string
          nullable: true
          description: Prezent doar dacă metoda a fost card_online

    # --- ERRORS (RFC 7807) ---

    ErrorDetail:
      type: object
      properties:
        type:
          type: string
          description: URI care identifică tipul erorii
        title:
          type: string
          description: Un scurt rezumat al erorii
        status:
          type: integer
          description: Codul HTTP
        detail:
          type: string
          description: Explicație specifică pentru această apariție a erorii
        instance:
          type: string
          description: URI-ul instanței unde a apărut eroarea
